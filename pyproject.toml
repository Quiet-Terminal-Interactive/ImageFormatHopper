[project]
name = "imageformathopper"
version = "0.1.0"
description = "Convert between image/sprite formats (PNG, JPG, GIF, WEBP, Aseprite, FireAlpaca, ...) via a shared intermediate representation."
requires-python = ">=3.10"
dependencies = ["Pillow>=12.3.0"]

[project.scripts]
imageformathopper = "imageformathopper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
